spring.application.name=hotel-system

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_hotel}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Send Mail Config
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# VNPay
payment.vnpay.enabled=${VNPAY_ENABLED:true}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.return-url=${VNPAY_RETURN_URL:https://ithotel.ct296.id.vn/customer/booking/payment/vnpay-return}
payment.vnpay.ipn-url=${VNPAY_IPN_URL:https://api.ct296.id.vn/customer/booking/payment/vnpay-ipn}
payment.vnpay.version=${VNPAY_VERSION:2.1.0}
payment.vnpay.command=${VNPAY_COMMAND:pay}
payment.vnpay.order-type=${VNPAY_ORDER_TYPE:other}
payment.vnpay.locale=${VNPAY_LOCALE:vn}
payment.vnpay.curr-code=${VNPAY_CURR_CODE:VND}
payment.vnpay.timeout-minutes=${VNPAY_TIMEOUT_MINUTES:30}
payment.vnpay.default-ip-address=${VNPAY_DEFAULT_IP_ADDRESS:127.0.0.1}
payment.vnpay.frontend-return-url=${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/customer/profile}

# AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

# Uploads
app.upload.dir=${APP_UPLOAD_DIR:uploads}

#Train
ai.review.scheduler.enabled=false
ai.review.api.url=http://localhost:8000/api/analyze